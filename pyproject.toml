[project]
name = "dpi-fraud-engine"
version = "1.0.0"
requires-python = ">=3.11,<3.12"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["dashboard", ".venv", "data", "models/artifacts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E731", "B008", "B905"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "integration: needs running Redis + PostgreSQL",
]
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]
