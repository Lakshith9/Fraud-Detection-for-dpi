# Live Mojaloop connection. Start the switch first (mojaloop/ml-core-test-harness creates the `mojaloop-net`
# network and its Kafka on kafka:29092), then run the engine with this overlay:
#   docker compose -f docker-compose.yml -f docker-compose.mojaloop.yml up -d --build
# The consumer reads topic-transfer-prepare with its own consumer group; see docs/mojaloop_integration.md.
services:
  mojaloop-consumer:
    build: { context: ., dockerfile: docker/Dockerfile.app }
    image: dpi-fraud-engine:latest
    env_file: [.env]
    environment:
      REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:29092}
    command: ["python", "-m", "pipeline.mojaloop_consumer"]
    networks: [default, mojaloop-net]
    restart: unless-stopped
    depends_on: { init: { condition: service_completed_successfully } }

networks:
  mojaloop-net:
    external: true
